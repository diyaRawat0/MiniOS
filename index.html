<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini OS Simulator</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --card-color: #2a2a2a;
            --text-color: #d4d4d4;
            --text-muted: #888;
            --accent-color: #0e86d4;
            --accent-green: #38a169;
            --accent-red: #e53e3e;
            --accent-orange: #f59e0b;
            --border-color: #444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 24px;
        }
        .card {
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
        }
        h1, h2, h3 {
            margin-top: 0;
            color: white;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-group { display: flex; flex-direction: column; }
        .form-group label {
            font-size: 0.9em;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .form-group input, .form-group select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            color: var(--text-color);
            font-size: 1em;
        }
        button {
            padding: 12px 16px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary { background-color: var(--accent-color); color: white; }
        .btn-primary:hover { opacity: 0.8; }
        
        .btn-secondary { background-color: var(--accent-green); color: white; }
        .btn-secondary:hover { opacity: 0.8; }

        .btn-tertiary { background-color: var(--accent-orange); color: white; }
        .btn-tertiary:hover { opacity: 0.8; }
        
        .btn-danger { background-color: var(--accent-red); color: white; }
        .btn-danger:hover { opacity: 0.8; }
        
        .button-group { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        th { color: var(--text-muted); }
        
        #results-card { grid-column: 1 / -1; }
        
        /* Gantt Chart */
        .gantt-chart {
            display: flex;
            height: 50px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            background-color: var(--bg-color);
        }
        .gantt-block {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            height: 100%;
            overflow: hidden;
            border-right: 1px solid var(--bg-color);
            white-space: nowrap;
        }
        .gantt-timeline {
            display: flex;
            position: relative;
            margin-top: 4px;
        }
        .gantt-time {
            font-size: 0.9em;
            color: var(--text-muted);
            position: absolute;
            transform: translateX(-50%); /* Center the time label */
        }
        .gantt-time:first-child { transform: translateX(0); }
        .gantt-time:last-child { transform: translateX(-100%); }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>Controls</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="arrival">Arrival Time</label>
                    <input type="number" id="arrival" value="0" min="0">
                </div>
                <div class="form-group">
                    <label for="burst">Burst Time</label>
                    <input type="number" id="burst" value="5" min="1">
                </div>
                <div class="form-group">
                    <label for="memory">Memory (MB)</label>
                    <input type="number" id="memory" value="256" min="1">
                </div>
                <div class="form-group">
                    <label for="priority">Priority</label>
                    <input type="number" id="priority" value="0" min="0">
                </div>
            </div>
            <div class="button-group">
                <button class="btn-primary" onclick="addProcess()">Add Process</button>
            </div>
            
            <h3 style="margin-top: 24px;">Simulation Settings</h3>
            <div class="form-group">
                <label for="memoryAlgo">Memory Allocation</label>
                <select id="memoryAlgo">
                    <option value="firstfit">First-Fit</option>
                    <option value="bestfit">Best-Fit</option>
                    <option value="worstfit">Worst-Fit</option>
                </select>
            </div>
            <div class="form-group" style="margin-top: 16px;">
                <label for="quantum">Time Quantum (for RR)</label>
                <input type="number" id="quantum" value="2" min="1">
            </div>
        </div>
        
        <div class="card">
            <h2>Process Queue</h2>
            <table id="process-table">
                <thead>
                    <tr><th>PID</th><th>Arrival</th><th>Burst</th><th>Memory</th><th>Priority</th></tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
            <div class="button-group">
                <button class="btn-secondary" onclick="runSimulation('fcfs')">Run FCFS</button>
                <button class="btn-secondary" onclick="runSimulation('sjf')">Run SJF</button>
                <button class="btn-tertiary" onclick="runSimulation('rr')">Run RR</button>
                <button class="btn-tertiary" onclick="runSimulation('priority')">Run Priority</button>
                <button class="btn-danger" onclick="resetQueue()">Reset</button>
            </div>
        </div>

        <div class="card" id="results-card">
            <h2>Results</h2>
            <div id="results-content" style="display: none;">
                <h3>Gantt Chart</h3>
                <div class="gantt-chart" id="gantt-chart"></div>
                <div class="gantt-timeline" id="gantt-timeline"></div>
                
                <h3 style="margin-top: 24px;">Statistics</h3>
                <p id="stats-waiting"></p>
                <p id="stats-turnaround"></p>
                
                <h3 style="margin-top: 24px;">Completed Processes</h3>
                <table id="results-table">
                    <thead>
                        <tr><th>PID</th><th>Arrival</th><th>Burst</th><th>Priority</th><th>Start</th><th>Completion</th><th>Wait</th><th>Turnaround</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <p id="results-placeholder">Run a simulation to see results here.</p>
        </div>
    </div>

    <script>
        // API Communication
        const API = {
            get: (endpoint) => fetch(endpoint).then(res => res.json()),
            post: (endpoint, body) => fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            }).then(res => res.json())
        };

        // On page load, fetch the current process list
        document.addEventListener('DOMContentLoaded', fetchProcesses);

        async function fetchProcesses() {
            const processes = await API.get('/api/get_processes');
            const tbody = document.querySelector('#process-table tbody');
            tbody.innerHTML = '';
            if (processes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="color: #888;">Queue is empty.</td></tr>';
            }
            processes.forEach(p => {
                tbody.innerHTML += `<tr><td>${p.pid}</td><td>${p.arrival}</td><td>${p.burst}</td><td>${p.memory}MB</td><td>${p.priority}</td></tr>`;
            });
        }

        async function addProcess() {
            const arrival = parseInt(document.getElementById('arrival').value);
            const burst = parseInt(document.getElementById('burst').value);
            const memory = parseInt(document.getElementById('memory').value);
            const priority = parseInt(document.getElementById('priority').value);
            
            await API.post('/api/add_process', { arrival, burst, memory, priority });
            await fetchProcesses();
        }

        async function resetQueue() {
            await API.post('/api/reset', {});
            await fetchProcesses();
            document.getElementById('results-content').style.display = 'none';
            document.getElementById('results-placeholder').style.display = 'block';
        }

        async function runSimulation(algo) {
            const memAlgo = document.getElementById('memoryAlgo').value;
            const quantum = parseInt(document.getElementById('quantum').value);
            
            const body = {
                algo: algo,
                memAlgo: memAlgo,
                quantum: quantum
            };
            
            const data = await API.post('/api/run_simulation', body);
            
            if (data.status === 'error') {
                alert('Error running simulation: ' + data.message);
                return;
            }

            document.getElementById('results-content').style.display = 'block';
            document.getElementById('results-placeholder').style.display = 'none';
            
            drawGanttChart(data.chart);
            showStats(data.stats);
            showResultsTable(data.processes);
        }

        function drawGanttChart(chartData) {
            const chartDiv = document.getElementById('gantt-chart');
            const timelineDiv = document.getElementById('gantt-timeline');
            chartDiv.innerHTML = '';
            timelineDiv.innerHTML = '';

            if (chartData.length === 0) {
                chartDiv.innerText = "No processes were able to run (e.g., due to memory constraints).";
                return;
            }

            const totalDuration = chartData[chartData.length - 1].end;
            if (totalDuration === 0) return; // Avoid divide by zero
            
            // Draw time 0
            const startTime = document.createElement('div');
            startTime.className = 'gantt-time';
            startTime.innerText = '0';
            startTime.style.left = '0%';
            timelineDiv.appendChild(startTime);
            
            let lastTime = 0;
            chartData.forEach(entry => {
                const duration = entry.end - entry.start;
                if (duration === 0) return; // Don't draw zero-width blocks
                
                const widthPercent = (duration / totalDuration) * 100;
                
                // Draw Block
                const block = document.createElement('div');
                block.className = 'gantt-block';
                block.innerText = `P${entry.pid}`;
                block.style.width = `${widthPercent}%`;
                const ansiColor = entry.color.match(/\[(\d+)m/)[1];
                block.style.backgroundColor = getCSSColor(ansiColor);
                chartDiv.appendChild(block);
                
                // Draw Time Marker
                if (entry.end > lastTime) {
                    const time = document.createElement('div');
                    time.className = 'gantt-time';
                    time.innerText = entry.end;
                    time.style.left = `${(entry.end / totalDuration) * 100}%`;
                    timelineDiv.appendChild(time);
                    lastTime = entry.end;
                }
            });
        }
        
        function getCSSColor(ansiCode) {
            const map = {
                '41': '#c50f1f', '42': '#13a10e', '43': '#c19c00', '44': '#0037da',
                '45': '#881798', '46': '#3a96dd', '101': '#f93c3c', '102': '#23d18b',
                '103': '#f5f543', '104': '#3b78ff', '105': '#d670d6', '106': '#61d6d6'
            };
            return map[ansiCode] || '#777';
        }

        function showStats(stats) {
            document.getElementById('stats-waiting').innerText = `Average Waiting Time: ${stats.avgWaiting.toFixed(2)}`;
            document.getElementById('stats-turnaround').innerText = `Average Turnaround Time: ${stats.avgTurnaround.toFixed(2)}`;
        }
        
        function showResultsTable(processes) {
            const tbody = document.querySelector('#results-table tbody');
            tbody.innerHTML = '';
            processes.forEach(p => {
                // Only show processes that actually completed
                if (p.completion === -1 || p.completion === undefined) {
                    tbody.innerHTML += `
                    <tr style="color: #888;">
                        <td>${p.pid}</td>
                        <td>${p.arrival}</td>
                        <td>${p.burst}</td>
                        <td>${p.priority}</td>
                        <td colspan="4">Process failed to run (e.g., OOM)</td>
                    </tr>`;
                } else {
                    tbody.innerHTML += `
                    <tr>
                        <td>${p.pid}</td>
                        <td>${p.arrival}</td>
                        <td>${p.burst}</td>
                        <td>${p.priority}</td>
                        <td>${p.start}</td>
                        <td>${p.completion}</td>
                        <td>${p.wait}</td>
                        <td>${p.turnaround}</td>
                    </tr>`;
                }
            });
        }
    </script>
</body>
</html>
